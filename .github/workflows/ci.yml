name: CI

on:
  pull_request:
    branches:
      - main
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with release.yml so releases run the gates that CI ran.
  # Must stay >= the Dart SDK required by flutter_lints (^3.8.0).
  FLUTTER_VERSION: 3.44.8

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install root dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example

      - name: Analyze package
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run VM tests
        run: flutter test --reporter expanded

      - name: Run web implementation smoke tests
        run: flutter test --platform chrome --reporter expanded test/web_implementations_test.dart

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Build example for web
        working-directory: example
        run: flutter build web

      - name: Validate package publication
        run: flutter pub publish --dry-run

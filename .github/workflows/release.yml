name: Release
run-name: ${{ github.event_name == 'push' && format('Release from {0}', github.ref_name) || format('Dry-run {0}', github.ref_name) }}

on:
  push:
    branches:
      - release
  # A manual invocation always runs validation only. There is deliberately no
  # version or production-mode input.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Keep in sync with ci.yml so releases run the gates that CI ran.
  # Must stay >= the Dart SDK required by flutter_lints (^3.8.0).
  FLUTTER_VERSION: 3.44.8

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve and validate release candidate
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_RELEASE: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' pubspec.yaml | head -n 1)"
          test -n "$version" || { echo 'Could not read pubspec version' >&2; exit 1; }
          tag="v${version}"

          # pub.dev versions are immutable, so refuse to re-publish one.
          package_json="$(mktemp)"
          curl --fail --silent --show-error \
            "https://pub.dev/api/packages/adaptive_network_image" > "$package_json"
          if jq -e --arg version "$version" \
            '.versions[] | select(.version == $version)' "$package_json" >/dev/null; then
            echo "Version ${version} is already published on pub.dev." >&2
            echo 'Bump the version in pubspec.yaml before releasing again.' >&2
            exit 1
          fi

          if [[ "$IS_RELEASE" == "true" ]]; then
            # The tag is created by this workflow, so an existing one means the
            # version was not bumped.
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists." >&2
              exit 1
            fi

            # Only publish commits that already landed on main, so the release
            # branch cannot ship code that bypassed review and CI.
            status="$(gh api \
              "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" \
              --jq '.status')"
            case "$status" in
              identical|behind) ;;
              *)
                echo "Commit ${GITHUB_SHA} is not contained in main (status: ${status})." >&2
                echo 'Merge to main first, then fast-forward the release branch to it.' >&2
                exit 1
                ;;
            esac
          else
            echo "Dry run for prospective tag ${tag} (manual runs never publish)."
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo '## Release candidate'
            echo
            echo "- Package version: \`${version}\`"
            echo "- Tag to create: \`${tag}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run VM tests
        run: flutter test --reporter expanded

      - name: Run web implementation smoke tests
        run: flutter test --platform chrome --reporter expanded test/web_implementations_test.dart

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Build example for web
        working-directory: example
        run: flutter build web

      - name: Validate package publication
        run: flutter pub publish --dry-run

  publish:
    name: Publish ${{ needs.validate.outputs.tag }}
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pub.dev
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Publish to pub.dev with OIDC
        run: flutter pub publish --force

      # Tagging follows publication because pub.dev is the irreversible step:
      # a tag with no published version behind it would have to be deleted by
      # hand. Creating the tag and the release together keeps them atomic.
      - name: Tag the published commit and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

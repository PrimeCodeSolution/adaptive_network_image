name: Release
run-name: ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || format('Dry-run {0}', github.ref_name) }}

on:
  push:
    tags:
      - 'v*'
  # A manual invocation always runs validation only. There is deliberately no
  # version or production-mode input.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with ci.yml so releases run the gates that CI ran.
  # Must stay >= the Dart SDK required by flutter_lints (^3.8.0).
  FLUTTER_VERSION: 3.44.8

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Validate version and tag checkout
        id: version
        shell: bash
        env:
          IS_TAG_RELEASE: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          version="$(dart pub deps --json 2>/dev/null | jq -r '.root.version' || true)"
          if [[ -z "$version" || "$version" == "null" ]]; then
            version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+([+][^[:space:]]+)?)$/\1/p' pubspec.yaml)"
          fi
          test -n "$version" || { echo 'Could not read pubspec version' >&2; exit 1; }
          expected_tag="v${version}"

          if [[ "$IS_TAG_RELEASE" == "true" ]]; then
            [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == "$expected_tag" ]] || {
              echo "Tag must be exactly ${expected_tag}; got ${GITHUB_REF_NAME}" >&2
              exit 1
            }
            tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}^{commit}")"
            head_commit="$(git rev-parse HEAD)"
            event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
            [[ "$head_commit" == "$event_commit" && "$head_commit" == "$tag_commit" ]] || {
              echo 'Checkout, event SHA, and tagged commit do not match' >&2
              exit 1
            }
          else
            echo "Dry run for prospective tag ${expected_tag} (manual runs never publish)."
          fi

          package_json="$(mktemp)"
          curl --fail --silent --show-error \
            "https://pub.dev/api/packages/adaptive_network_image" > "$package_json"
          if jq -e --arg version "$version" \
            '.versions[] | select(.version == $version)' "$package_json" >/dev/null; then
            echo "Version ${version} is already published on pub.dev" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"
          {
            echo '## Release candidate'
            echo
            echo "- Package version: \`${version}\`"
            echo "- Expected tag: \`${expected_tag}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run VM tests
        run: flutter test --reporter expanded

      - name: Run web implementation smoke tests
        run: flutter test --platform chrome --reporter expanded test/web_implementations_test.dart

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Build example for web
        working-directory: example
        run: flutter build web

      - name: Validate package publication
        run: flutter pub publish --dry-run

  publish:
    name: Confirm and publish ${{ needs.validate.outputs.tag }}
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pub.dev
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout validated tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Reconfirm validated commit
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}^{commit}")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          [[ "$(git rev-parse HEAD)" == "$event_commit" && "$event_commit" == "$tag_commit" ]]

      - name: Install dependencies
        run: flutter pub get

      - name: Publish to pub.dev with OIDC
        run: flutter pub publish --force

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
